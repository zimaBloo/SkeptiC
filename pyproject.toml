[project]
name = "skeptic"
version = "0.1.0"
description = "A panel of AI critics that says what is weak or risky about an innovation idea."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28",
    "inspect-ai>=0.3.289",
    "openai>=2.0",
    "pydantic>=2.12",
]

[project.entry-points.inspect_ai]
skeptic = "skeptic._registry"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeptic"]

[tool.uv]
# Supply-chain safety: ignore package releases from the last 7 days.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
